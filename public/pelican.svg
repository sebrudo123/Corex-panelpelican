<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="corex-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#00A8FF"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>
    <linearGradient id="corex-grad-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="corex-dark-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#050b14"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="core-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#corex-grad-primary)" opacity="0.12" filter="url(#core-glow)" />

  <!-- Outer Hexagonal Frame -->
  <polygon points="256,42 438,147 438,357 256,462 74,357 74,147" 
           fill="url(#core-dark)" 
           stroke="url(#corex-grad-primary)" 
           stroke-width="14" 
           stroke-linejoin="round"
           filter="url(#neon-glow)" />

  <!-- Inner Dark Chamber -->
  <polygon points="256,70 412,160 412,344 256,434 100,344 100,160" 
           fill="url(#corex-dark-core)" 
           stroke="rgba(0, 240, 255, 0.25)" 
           stroke-width="4" />

  <!-- Tech Accent Orbit Lines -->
  <path d="M140,180 L256,115 L372,180" fill="none" stroke="url(#corex-grad-primary)" stroke-width="4" stroke-dasharray="12,8" opacity="0.6"/>
  <path d="M140,332 L256,397 L372,332" fill="none" stroke="url(#corex-grad-glow)" stroke-width="4" stroke-dasharray="12,8" opacity="0.6"/>

  <!-- Core "C" Monogram Reactor Emblem -->
  <!-- Upper C Horn -->
  <path d="M340,175 C310,135 250,130 205,160 C155,195 150,270 190,320 C230,365 315,365 345,330 L315,295 C295,315 245,320 220,295 C190,265 195,225 225,200 C250,180 290,185 312,205 Z"
        fill="url(#corex-grad-primary)"
        filter="url(#neon-glow)"/>

  <!-- Center Energy Core Crystal -->
  <polygon points="275,256 256,225 294,225" fill="#00FFA3" filter="url(#neon-glow)"/>
  <polygon points="275,256 294,225 313,256" fill="#00F0FF" filter="url(#neon-glow)"/>
  <polygon points="275,256 313,256 294,287" fill="#00FFA3" filter="url(#neon-glow)"/>
  <polygon points="275,256 294,287 256,287" fill="#00A8FF" filter="url(#neon-glow)"/>

  <!-- Quantum Data Points / Node Dots -->
  <circle cx="256" cy="42" r="8" fill="#00FFA3" filter="url(#neon-glow)"/>
  <circle cx="438" cy="147" r="8" fill="#00F0FF" filter="url(#neon-glow)"/>
  <circle cx="438" cy="357" r="8" fill="#00FFA3" filter="url(#neon-glow)"/>
  <circle cx="256" cy="462" r="8" fill="#00F0FF" filter="url(#neon-glow)"/>
  <circle cx="74" cy="357" r="8" fill="#00FFA3" filter="url(#neon-glow)"/>
  <circle cx="74" cy="147" r="8" fill="#00F0FF" filter="url(#neon-glow)"/>
</svg>
