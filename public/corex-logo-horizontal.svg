<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="corex-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2F5FF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="corex-accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>
    <filter id="h-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem (Compact Hexagon) -->
  <g transform="translate(10, 10) scale(0.195)">
    <!-- Hexagon Frame -->
    <polygon points="256,42 438,147 438,357 256,462 74,357 74,147" 
             fill="#080e18" 
             stroke="url(#icon-grad)" 
             stroke-width="22" 
             stroke-linejoin="round"
             filter="url(#h-glow)"/>
    <!-- C Core -->
    <path d="M340,175 C310,135 250,130 205,160 C155,195 150,270 190,320 C230,365 315,365 345,330 L315,295 C295,315 245,320 220,295 C190,265 195,225 225,200 C250,180 290,185 312,205 Z"
          fill="url(#icon-grad)"
          filter="url(#h-glow)"/>
    <!-- Center Crystal -->
    <polygon points="275,256 256,225 294,225" fill="#00FFA3"/>
    <polygon points="275,256 294,225 313,256" fill="#00F0FF"/>
    <polygon points="275,256 313,256 294,287" fill="#00FFA3"/>
    <polygon points="275,256 294,287 256,287" fill="#00F0FF"/>
  </g>

  <!-- Wordmark Text -->
  <text x="125" y="72" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" letter-spacing="4" fill="url(#corex-text-grad)">COREX</text>
  <text x="325" y="72" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" letter-spacing="6" fill="url(#corex-accent-grad)">PANEL</text>

  <!-- Subtitle Tagline -->
  <text x="128" y="98" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="600" font-size="11" letter-spacing="2.5" fill="#64748B" text-transform="uppercase">INFRASTRUCTURE ENGINE</text>
</svg>
