x-common:
  panel:
    &panel-environment
    APP_URL: "http://localhost" # can be set to 'http://localhost' on port 80 only
    LE_EMAIL: "USEYOUROWNEMAILHERE@example.com" # email to be used for let's encrypt certificates
    APP_DEBUG: "false"
    APP_ENV: "production"

    # BEHIND_PROXY: true # uncomment to run behind a proxy
    # TRUSTED_PROXIES: 127.0.0.1,172.17.0.1,172.20.0.1 # defaults are for local proxies

  mail:
    &mail-environment
    MAIL_DRIVER: "log"
    # MAIL_HOST: ""
    # MAIL_PORT: ""
    # MAIL_FROM: ""
    # MAIL_USERNAME: ""
    # MAIL_PASSWORD: ""
    # MAIL_SCHEME: ""

  database:
    &db-environment
    # Do not remove the "&db-password" from the end of the line below, it is important
    # for Panel functionality.
    MYSQL_ROOT_PASSWORD: "SUPERNEEDSTOCHANGE"
    MYSQL_PASSWORD: &db-password "NEEDSTOCHANGE"
    MYSQL_DATABASE: &db-database "panel"
    MYSQL_USER: &db-username "pelican"

#
# ------------------------------------------------------------------------------------------
# DANGER ZONE BELOW
#
# The remainder of this file likely does not need to be changed. Please only make modifications
# below if you understand what you are doing.
#

services:
  database:
    image: mariadb:10.11
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - pelican-db:/var/lib/mysql
    environment:
      <<: *db-environment

  cache:
    image: redis:alpine
    restart: always

  panel:
    image: corex-panel:latest
    restart: unless-stopped
    networks:
      - default
    ports:
      - "80:80"
      - "443:443"
    links:
      - database
      - cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pelican-data:/pelican-data
      - pelican-logs:/var/www/html/storage/logs
      - type: volume
        source: pelican-data
        target: /var/www/html/plugins
        volume:
          subpath: plugins
      - ./public/corex.svg:/var/www/html/public/corex.svg:ro
      - ./public/corex-logo-horizontal.svg:/var/www/html/public/corex-logo-horizontal.svg:ro
      - ./public/pelican.svg:/var/www/html/public/pelican.svg:ro
      - ./app/Filament/Server/Pages/PluginMarketplace.php:/var/www/html/app/Filament/Server/Pages/PluginMarketplace.php:ro
      - ./resources/views/filament/server/pages/plugin-marketplace.blade.php:/var/www/html/resources/views/filament/server/pages/plugin-marketplace.blade.php:ro
      - ./app/Console/Commands/Corex:/var/www/html/app/Console/Commands/Corex:ro
      - ./database/eggs/corex:/var/www/html/database/eggs/corex:ro
      - ./app/Providers/Filament/PanelProvider.php:/var/www/html/app/Providers/Filament/PanelProvider.php:ro
      - ./app/Providers/Filament/FilamentServiceProvider.php:/var/www/html/app/Providers/Filament/FilamentServiceProvider.php:ro
      - ./config/app.php:/var/www/html/config/app.php:ro
    environment:
      <<: [*panel-environment, *mail-environment]
      XDG_DATA_HOME: /pelican-data
      # SKIP_CADDY: true # enable when not using caddy.
      CACHE_STORE: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_CONNECTION: "redis"
      REDIS_HOST: "cache"
      DB_CONNECTION: "mariadb"
      DB_HOST: "database"
      DB_PORT: "3306"
      DB_DATABASE: *db-database
      DB_USERNAME: *db-username
      DB_PASSWORD: *db-password

volumes:
  pelican-data:
  pelican-logs:
  pelican-db:

networks:
  default:
    ipam:
      config:
        - subnet: 172.20.0.0/16
